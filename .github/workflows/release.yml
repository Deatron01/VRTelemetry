name: Release

# Builds the desktop app (Windows installer + Linux AppImage) and the Python
# package (for hub machines), then publishes them as a GitHub Release.
#
# Trigger: push a tag `vX.Y.Z` that matches the version in pyproject.toml and
# package.json, or run it by hand from the Actions tab with an existing tag.
#
# Built on the target OS on purpose: PyInstaller cannot cross-compile, so the
# Windows backend has to be frozen on Windows.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and publish, e.g. v1.0.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # No signing certificate yet; stop electron-builder hunting for one.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  check-version:
    name: Tag matches project version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Compare tag, pyproject.toml and package.json
        run: |
          py=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          js=$(node -p "require('./package.json').version")
          echo "tag=$TAG pyproject=$py package.json=$js"
          test "v$py" = "$TAG" && test "v$js" = "$TAG"

  python-dist:
    name: Python package (wheel + sdist)
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  desktop:
    name: Desktop app (${{ matrix.os }})
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis
            artifact: release/*.exe
          - os: ubuntu-latest
            target: --linux AppImage
            artifact: release/*.AppImage
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/ci-constraints.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/frontend/VRTelemetry/package-lock.json
      - name: Install the workstation backend and PyInstaller
        run: pip install -e ".[workstation]" "pyinstaller>=6.10,<7" -c .github/ci-constraints.txt
      - name: Install the desktop shell
        run: npm ci
      - name: Installer licence page, frontend, frozen backend
        run: npm run prepackage
      - name: Smoke-test the frozen backend
        shell: bash
        run: |
          exe=build/dist-backend/vrtelemetry-backend/vrtelemetry-backend
          [ -f "$exe.exe" ] && exe="$exe.exe"
          export VRT_PATHS__DATA_ROOT="$RUNNER_TEMP/smoke"
          "$exe" > "$RUNNER_TEMP/backend.log" 2>&1 &
          pid=$!
          stop() { kill "$pid" 2>/dev/null || true; taskkill //F //IM vrtelemetry-backend.exe > /dev/null 2>&1 || true; }
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8000/openapi.json > /dev/null; then
              echo "frozen backend up after ${i}s"; stop; exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/backend.log"; stop; exit 1
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [python-dist, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum * | tee SHA256SUMS.txt
      - name: Release notes
        run: |
          {
            echo "> [!WARNING]"
            echo "> **Research use only — not a medical device.** VRTelemetry records and summarises sensor data for non-clinical research. It does not diagnose, monitor, predict or treat any medical condition, is not CE-marked or FDA-cleared, and its derived scores are research-support indices, not validated clinical measures or medical advice. Provided \"as is\", without warranty. Read [DISCLAIMER.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/DISCLAIMER.md) before use."
            echo
            cat .github/release-notes.md
            echo
            echo "### Checksums (SHA-256)"
            echo '```'
            cat assets/SHA256SUMS.txt
            echo '```'
          } > notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" assets/* \
              --verify-tag \
              --title "VRTelemetry ${TAG}" \
              --notes-file notes.md \
              --generate-notes
          fi

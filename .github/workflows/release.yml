name: Release

# Builds the desktop app (Windows installer + Linux AppImage), the hub's
# Windows installer, and the Python package (for Linux hubs), then publishes
# them as a GitHub Release.
#
# Trigger: push a tag `vX.Y.Z` that matches the version in pyproject.toml and
# package.json, or run it by hand from the Actions tab (Release -> Run workflow)
# with a tag name; a missing tag is created on that branch's head.
#
# Built on the target OS on purpose: PyInstaller cannot cross-compile, so the
# Windows backend has to be frozen on Windows.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, e.g. v1.0.0. Created on the selected branch's head if it does not exist yet."
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # No signing certificate yet; stop electron-builder hunting for one.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  check-version:
    name: Tag matches project version
    runs-on: ubuntu-latest
    steps:
      # Checks out the pushed tag, or for a manual run the selected branch.
      - uses: actions/checkout@v4
      - name: Compare tag, pyproject.toml and package.json
        run: |
          py=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          js=$(node -p "require('./package.json').version")
          echo "tag=$TAG pyproject=$py package.json=$js"
          test "v$py" = "$TAG" && test "v$js" = "$TAG"
      # A manual run may name a tag that does not exist yet: create it on the
      # commit being built, so every later job checks out exactly that commit.
      # Pushed with GITHUB_TOKEN, which deliberately does not re-trigger this
      # workflow's `push: tags` path.
      - name: Create the tag if it does not exist
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "VRTelemetry ${TAG#v} - research use only, not a medical device"
            git push origin "refs/tags/$TAG"
          fi

  python-dist:
    name: Python package (wheel + sdist)
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  desktop:
    name: Desktop app (${{ matrix.os }})
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis
            artifact: release/*.exe
          - os: ubuntu-latest
            target: --linux AppImage
            artifact: release/*.AppImage
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/ci-constraints.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/frontend/VRTelemetry/package-lock.json
      # av_recording: session video and its transcription (P-C7) are features
      # of the app; without the extra the frozen backend silently cannot
      # record them, and the release would do less than a source install.
      - name: Install the workstation backend and PyInstaller
        run: pip install -e ".[workstation,av_recording]" "pyinstaller>=6.10,<7" -c .github/ci-constraints.txt
      - name: Install the desktop shell
        run: npm ci
      - name: Installer licence page, frontend, frozen backend
        run: npm run prepackage
      - name: Smoke-test the frozen backend
        shell: bash
        run: |
          exe=build/dist-backend/vrtelemetry-backend/vrtelemetry-backend
          [ -f "$exe.exe" ] && exe="$exe.exe"
          export VRT_PATHS__DATA_ROOT="$RUNNER_TEMP/smoke"
          "$exe" > "$RUNNER_TEMP/backend.log" 2>&1 &
          pid=$!
          stop() { kill "$pid" 2>/dev/null || true; taskkill //F //IM vrtelemetry-backend.exe > /dev/null 2>&1 || true; }
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8000/openapi.json > /dev/null; then
              echo "frozen backend up after ${i}s"; stop; exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/backend.log"; stop; exit 1
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  hub-windows:
    name: Hub installer (Windows)
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/ci-constraints.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Editable install: build/hub.spec copies the package metadata so the
      # frozen hub reports its real version.
      - name: Install the hub and PyInstaller
        run: pip install -e ".[server]" "pyinstaller>=6.10,<7" -c .github/ci-constraints.txt
      - name: Freeze the hub
        run: pyinstaller build/hub.spec --distpath build/dist-hub --workpath build/work-hub --noconfirm
      # setup into a scratch root, then serve over TLS on loopback and ask
      # /health with the generated CA -- the path the installer takes.
      - name: Smoke-test the frozen hub
        shell: bash
        run: |
          exe=build/dist-hub/vrtelemetry-hub/vrtelemetry-hub.exe
          root="$RUNNER_TEMP/hub"
          "$exe" --data-root "$root" setup --address 127.0.0.1 --port 9555
          sed -i 's/^host = .*/host = "127.0.0.1"/' "$root/config.toml"
          "$exe" --data-root "$root" > "$RUNNER_TEMP/hub.log" 2>&1 &
          stop() { taskkill //F //IM vrtelemetry-hub.exe > /dev/null 2>&1 || true; }
          for i in $(seq 1 60); do
            body=$(python -c "import requests,sys;print(requests.get('https://127.0.0.1:9555/health',verify=sys.argv[1],timeout=2).json()['service'])" "$root/workstation-kit/hub-ca.pem" 2>/dev/null) || true
            if [ "$body" = "vrtelemetry-hub" ]; then
              echo "frozen hub up after ${i}s"; stop; exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/hub.log"; stop; exit 1
      - name: Installer licence page
        run: node build/make-installer-license.js
      # NSIS ships on GitHub's Windows images; install it if an image ever
      # stops carrying it rather than failing on a missing makensis.
      - name: Build the installer
        shell: bash
        run: |
          command -v makensis > /dev/null || choco install nsis -y --no-progress
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          makensis -V3 "-DVERSION=${TAG#v}" build/hub-installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: hub-windows
          path: release/VRTelemetry-Hub-Setup-*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [python-dist, desktop, hub-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # Not `assets/`: that is a directory in the repository (assets/brand),
      # and `gh release upload assets/*` would then try to upload it.
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Checksums
        working-directory: release-assets
        run: sha256sum * | tee SHA256SUMS.txt
      - name: Release notes
        run: |
          {
            echo "> [!WARNING]"
            echo "> **Research use only — not a medical device.** VRTelemetry records and summarises sensor data for non-clinical research. It does not diagnose, monitor, predict or treat any medical condition, is not CE-marked or FDA-cleared, and its derived scores are research-support indices, not validated clinical measures or medical advice. Provided \"as is\", without warranty. Read [DISCLAIMER.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/DISCLAIMER.md) before use."
            echo
            cat .github/release-notes.md
            echo
            echo "### Checksums (SHA-256)"
            echo '```'
            cat release-assets/SHA256SUMS.txt
            echo '```'
          } > notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" release-assets/* \
              --verify-tag \
              --title "VRTelemetry ${TAG}" \
              --notes-file notes.md \
              --generate-notes
          fi

# .pre-commit-config.yaml
#
# Install once per clone:
#     pip install -e ".[dev]"
#     pre-commit install
#
# These are the same gates CI runs (.github/workflows/ci.yml). Running them here
# first is the point: a lint failure found in 200 ms on your machine costs
# nothing, and the same failure found three minutes into a CI run costs a
# context switch.
#
# Hook versions are pinned. `pre-commit autoupdate` bumps them; do that
# deliberately in its own commit so a formatting change never arrives inside a
# behaviour change.

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict        # Windows and macOS are case-insensitive; Linux CI is not
      - id: detect-private-key
      - id: check-added-large-files
        # 500 KB. Deliberately tight: this repository previously took a 100 MB
        # archive, a 32 MB APK and 672 files of recorded session data into its
        # public history. Large files belong in release assets or the data
        # directories, never in a commit.
        args: ["--maxkb=500"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in step with what CI installs (`ruff>=0.5`, so the latest). At
    # v0.6.9 this hook rejected files CI accepts -- E402 after
    # pytest.importorskip, which newer ruff allows -- and blocked commits of
    # tests written exactly like the ones already in the tree.
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        # mypy needs the project's own dependencies to resolve imports, and the
        # hook runs in an isolated environment, so they are listed explicitly.
        # Keep in step with the `dev` extra in pyproject.toml.
        #
        # The list drifted once and blocked every commit on 12 Sep with nine
        # import-not-found errors -- for numpy, tomli, pydantic_settings,
        # cryptography and uvicorn, none of them real problems, all of them
        # simply missing from this sandbox. Anything imported at module scope in
        # src/ or tools/ and *not* covered by an ignore_missing_imports override
        # in pyproject.toml has to appear here, or this gate fails on a clean
        # tree -- and a gate that does that is one people uninstall.
        #
        # Running it from the developer's own venv instead was tried and is
        # worse: `language: system` resolves `python` against whatever shell git
        # was launched from, so it passes in an activated terminal and fails
        # from every GUI client.
        additional_dependencies:
          - pydantic>=2.6
          - fastapi>=0.110
          - types-requests
          - numpy>=1.26.4
          - pydantic-settings>=2.2
          - cryptography
          - uvicorn>=0.27
          - tomli>=2.0
        pass_filenames: false
        # CI's verdict is the Linux one, so this has to ask the same question.
        # Without it, openxr_headless.py's `ctypes.windll` type-ignore reads as
        # unused on a Windows machine and fails here while passing in CI --
        # issue #43, and one of the two things blocking commits on 12 Sep.
        args: ["--platform", "linux"]

  - repo: local
    hooks:
      - id: repo-hygiene
        name: repository hygiene (no data, no vendored deps, build inputs tracked)
        entry: python tools/check_repo_hygiene.py
        language: system
        pass_filenames: false
        always_run: true

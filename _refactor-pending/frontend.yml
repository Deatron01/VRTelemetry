name: Frontend

on:
  push:
    branches: [main]
    paths: ["src/frontend/**", "electron/**", "package.json", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["src/frontend/**", "electron/**", "package.json", ".github/workflows/frontend.yml"]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/VRTelemetry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/VRTelemetry/package-lock.json
      - run: npm ci
      - name: tsc --noEmit
        # Not yet in strict mode. VRT-18 turns strict on and fixes the fallout;
        # this at least holds the current line rather than nothing.
        run: npx tsc --noEmit
      - name: oxlint
        run: npx oxlint
      - name: vite build
        run: npm run build

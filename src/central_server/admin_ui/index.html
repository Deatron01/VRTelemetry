<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <title>VRTelemetry — Admin Console</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            slate: { 850: '#151e2e' }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbar for tables */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    .toast-enter { animation: slideIn 0.3s ease-out forwards; }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
    th.sortable:hover { color: #e2e8f0; }
    th.sortable .sort-arrow { opacity: 0.4; margin-left: 4px; font-size: 10px; }
    th.sortable.sort-active .sort-arrow { opacity: 1; color: #60a5fa; }

    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 9999px; }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(2, 6, 23, 0.7);
      display: flex; align-items: center; justify-content: center; z-index: 60;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans antialiased overflow-hidden">
  <div id="app" class="h-screen w-full flex"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>
  <div id="modal-container"></div>

  <script>
    const API = window.location.origin;
    let sessionToken = localStorage.getItem('admin_session_token') || null;
    let currentUser = null;
    let activeTab = 'clients';

    // Cached raw rows per tab, so client-side search/sort never re-fetches.
    const tableState = {
      clients:  { rows: [], sortKey: 'last_seen_at', sortDir: 'desc', query: '' },
      licenses: { rows: [], sortKey: 'issued_at',    sortDir: 'desc', query: '' },
      users:    { rows: [], sortKey: 'created_at',   sortDir: 'desc', query: '' },
      sessions: { rows: [], sortKey: 'received_at',  sortDir: 'desc', query: '', filterLicense: '' },
      patients: { rows: [], sortKey: 'last_updated_at', sortDir: 'desc', query: '', filterLicense: '' },
      files:    { rows: [], sortKey: 'last_modified', sortDir: 'desc', query: '' },
      plugins:  { rows: [], sortKey: 'name', sortDir: 'asc', query: '' },
    };
    let allLicenses = []; // used to populate license filter dropdowns
    let clientsAutoRefresh = null;

    // --- API Wrapper ---
    async function api(path, opts = {}) {
      const headers = opts.headers || {};
      if (sessionToken && path.startsWith('/admin')) headers['X-Session-Token'] = sessionToken;
      const res = await fetch(API + path, { ...opts, headers });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || res.statusText);
      }
      return res.json();
    }

    // --- Toast Notifications ---
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bg = type === 'success' ? 'bg-emerald-900/90 border-emerald-700 text-emerald-200' : 'bg-red-900/90 border-red-700 text-red-200';
      toast.className = `toast-enter ${bg} border px-4 py-3 rounded-lg shadow-lg text-sm flex items-center gap-3`;
      toast.innerHTML = `
        <span class="block">${escapeHtml(message)}</span>
        <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white">&times;</button>
      `;
      container.appendChild(toast);
      setTimeout(() => { if (toast.parentElement) toast.remove(); }, 4000);
    }

    function escapeHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s)
        .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;').replaceAll("'", '&#39;');
    }

    // The API sends UTC timestamps with no zone on them: "2026-09-01 08:00:00"
    // from SQLite's CURRENT_TIMESTAMP, "2026-09-01T08:00:00" from Python. The
    // Date constructor reads a zone-less string as *local*, so every timestamp
    // on this dashboard rendered by the viewer's UTC offset too early -- two
    // hours, in Central Europe -- while the Online/Offline chip beside it, which
    // the server computes in UTC, was correct. A machine could read as online
    // next to a "last seen" two hours stale (VRT-21).
    //
    // This is the reader's half of the fix. The writer's half -- having the API
    // say which zone it means -- is the recorded follow-up; doing it here first
    // means the dashboard is right either way, including for rows already
    // stored.
    function asUtc(v) {
      const text = String(v).trim();
      if (/(Z|z|[+-]\d{2}:?\d{2})$/.test(text)) return text;  // already zoned
      return text.replace(' ', 'T') + 'Z';
    }

    function fmtDate(v) {
      if (!v) return '<span class="text-slate-500">—</span>';
      const d = new Date(asUtc(v));
      if (isNaN(d.getTime())) return escapeHtml(v);
      return d.toLocaleString();
    }

    function relativeTime(seconds) {
      if (seconds === null || seconds === undefined) return 'never';
      if (seconds < 5) return 'just now';
      if (seconds < 60) return `${Math.floor(seconds)}s ago`;
      if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
      if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
      return `${Math.floor(seconds / 86400)}d ago`;
    }

    function formatBytes(bytes, decimals = 2) {
      if (!+bytes) return '0 Bytes';
      const k = 1024, dm = decimals < 0 ? 0 : decimals, sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
    }

    function badge(text, color) {
      const colors = {
        green: 'bg-emerald-900/50 text-emerald-400 border-emerald-800',
        red: 'bg-red-900/50 text-red-400 border-red-800',
        slate: 'bg-slate-700 text-slate-300 border-slate-600',
        purple: 'bg-purple-900/50 text-purple-400 border-purple-800',
        amber: 'bg-amber-900/50 text-amber-400 border-amber-800',
        blue: 'bg-blue-900/50 text-blue-400 border-blue-800',
      };
      return `<span class="px-2.5 py-1 rounded-full text-xs font-medium border ${colors[color] || colors.slate}">${escapeHtml(text)}</span>`;
    }

    // --- Generic modal JSON / detail viewer ("no data hidden") ---
    function showDetailModal(title, obj) {
      const container = document.getElementById('modal-container');
      let pretty;
      try { pretty = JSON.stringify(obj, null, 2); } catch (e) { pretty = String(obj); }
      container.innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this) this.remove()">
          <div class="bg-slate-800 border border-slate-700 rounded-xl shadow-2xl w-full max-w-2xl max-h-[80vh] flex flex-col">
            <div class="flex items-center justify-between px-5 py-4 border-b border-slate-700">
              <h3 class="font-semibold text-slate-100">${escapeHtml(title)}</h3>
              <button onclick="document.getElementById('modal-container').innerHTML=''" class="text-slate-400 hover:text-white text-xl leading-none">&times;</button>
            </div>
            <pre class="p-5 overflow-auto text-xs text-slate-300 font-mono whitespace-pre-wrap">${escapeHtml(pretty)}</pre>
          </div>
        </div>`;
    }

    // --- Generic sortable/filterable DataTable renderer ---
    // columns: [{ key, label, sortable=true, render(row) -> html string, sortValue(row) -> comparable }]
    function renderDataTable(tabId, columns, extraFilterHtml = '') {
      const state = tableState[tabId];
      return `
        <div class="flex flex-wrap gap-3 justify-between items-center mb-4">
          <div class="flex gap-2 items-center flex-wrap">
            <input id="${tabId}-search" type="text" placeholder="Search / filter..."
                   value="${escapeHtml(state.query)}"
                   oninput="onTableSearch('${tabId}', this.value)"
                   class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm w-56 focus:border-blue-500 outline-none" />
            ${extraFilterHtml}
          </div>
          <button onclick="refreshTab('${tabId}')" class="text-sm bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg transition-colors">Refresh</button>
        </div>
        <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden">
          <div class="overflow-x-auto">
            <table id="${tabId}-table" class="w-full text-sm text-left">
              <thead class="text-xs text-slate-400 uppercase bg-slate-850/50 border-b border-slate-700">
                <tr>
                  ${columns.map(c => `
                    <th class="px-6 py-3 font-medium ${c.sortable === false ? '' : 'sortable'} ${state.sortKey === c.key ? 'sort-active' : ''}"
                        ${c.sortable === false ? '' : `onclick="onTableSort('${tabId}', '${c.key}')"`}>
                      ${escapeHtml(c.label)}${c.sortable === false ? '' : `<span class="sort-arrow">${state.sortKey === c.key ? (state.sortDir === 'asc' ? '▲' : '▼') : '↕'}</span>`}
                    </th>`).join('')}
                </tr>
              </thead>
              <tbody id="${tabId}-tbody" class="divide-y divide-slate-700/50"></tbody>
            </table>
          </div>
        </div>
        <p id="${tabId}-count" class="text-xs text-slate-500 mt-2"></p>`;
    }

    function matchesQuery(row, query) {
      if (!query) return true;
      const q = query.toLowerCase();
      return JSON.stringify(row).toLowerCase().includes(q);
    }

    function getSortValue(col, row) {
      if (col.sortValue) return col.sortValue(row);
      const v = row[col.key];
      return v === null || v === undefined ? '' : v;
    }

    function renderTableBody(tabId, columns, extraFilter) {
      const state = tableState[tabId];
      let rows = state.rows.filter(r => matchesQuery(r, state.query));
      if (extraFilter) rows = rows.filter(extraFilter);

      const col = columns.find(c => c.key === state.sortKey);
      if (col) {
        rows = rows.slice().sort((a, b) => {
          const av = getSortValue(col, a), bv = getSortValue(col, b);
          if (av < bv) return state.sortDir === 'asc' ? -1 : 1;
          if (av > bv) return state.sortDir === 'asc' ? 1 : -1;
          return 0;
        });
      }

      const tbody = document.getElementById(`${tabId}-tbody`);
      if (!tbody) return;
      if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${columns.length}" class="px-6 py-8 text-center text-slate-500">No matching rows.</td></tr>`;
      } else {
        tbody.innerHTML = rows.map(r => `<tr class="hover:bg-slate-750 transition-colors">${
          columns.map(c => `<td class="px-6 py-4 align-top ${c.className || ''}">${c.render ? c.render(r) : escapeHtml(r[c.key])}</td>`).join('')
        }</tr>`).join('');
      }
      const countEl = document.getElementById(`${tabId}-count`);
      if (countEl) countEl.textContent = `${rows.length} of ${state.rows.length} row(s) shown`;

      // refresh header sort indicators
      document.querySelectorAll(`#${tabId}-table thead th.sortable`).forEach(th => th.classList.remove('sort-active'));
    }

    function onTableSearch(tabId, value) {
      tableState[tabId].query = value;
      rerenderTab(tabId);
    }

    function onTableSort(tabId, key) {
      const state = tableState[tabId];
      if (state.sortKey === key) {
        state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        state.sortKey = key;
        state.sortDir = 'asc';
      }
      render(); // re-render whole tab so header arrows/sort-active classes update too
      switchTab(activeTab, /*skipReload*/ true);
    }

    function rerenderTab(tabId) {
      const renderers = {
        clients: () => renderTableBody('clients', clientsColumns()),
        licenses: () => renderTableBody('licenses', licensesColumns()),
        users: () => renderTableBody('users', usersColumns()),
        sessions: () => renderTableBody('sessions', sessionsColumns(), sessionsExtraFilter()),
        patients: () => renderTableBody('patients', patientsColumns(), patientsExtraFilter()),
        files: () => renderTableBody('files', filesColumns()),
        plugins: () => renderTableBody('plugins', pluginsColumns()),
      };
      if (renderers[tabId]) renderers[tabId]();
    }

    // --- Rendering Logic ---
    function render() {
      const el = document.getElementById('app');
      if (!sessionToken || !currentUser) {
        el.innerHTML = renderLogin();
        return;
      }
      el.innerHTML = renderLayout();
    }

    function renderLogin() {
      return `
        <div class="m-auto w-full max-w-md p-8 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl">
          <div class="mb-8 text-center">
            <img src="hub-mark.svg" alt="" width="64" height="64" class="mx-auto mb-4 rounded-2xl" />
            <h1 class="text-2xl font-bold text-white mb-2">VRTelemetry Admin</h1>
            <p class="text-slate-400 text-sm">Sign in to access the control panel</p>
          </div>
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Email</label>
              <input id="email" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="admin@vrtelemetry.com" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Password</label>
              <input id="password" type="password" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="••••••••" />
            </div>
            <button onclick="doLogin()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg transition-colors mt-2">Sign In</button>
            <div id="login-error" class="text-red-400 text-sm text-center mt-4 hidden"></div>
          </div>
        </div>`;
    }

    function renderLayout() {
      return `
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-850 border-r border-slate-800 flex flex-col">
          <div class="p-6 border-b border-slate-800 flex items-center gap-3">
            <img src="hub-mark.svg" alt="" width="36" height="36" class="flex-none rounded-lg" />
            <div class="min-w-0">
              <h1 class="text-lg font-bold text-white tracking-tight leading-tight">VRTelemetry</h1>
              <p class="text-xs text-slate-400 truncate">${escapeHtml(currentUser.email)}</p>
            </div>
          </div>
          <nav class="flex-1 p-4 space-y-1">
            ${renderNavBtn('clients', 'Active Clients')}
            ${renderNavBtn('licenses', 'Licenses & Issuance')}
            ${renderNavBtn('users', 'User Management')}
            ${renderNavBtn('sessions', 'Telemetry Sessions')}
            ${renderNavBtn('patients', 'Patient Registry')}
            ${renderNavBtn('files', 'Raw Data Files')}
            ${renderNavBtn('plugins', 'Plugin Catalog')}
          </nav>
          <div class="p-4 border-t border-slate-800">
            <button onclick="doLogout()" class="w-full text-left px-4 py-2 text-sm text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">Sign Out</button>
          </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col bg-slate-900 overflow-hidden">
          <header class="h-16 border-b border-slate-800 flex items-center px-8 bg-slate-900/50 backdrop-blur-sm z-10">
            <h2 id="page-title" class="text-lg font-semibold text-slate-100"></h2>
          </header>
          <div class="flex-1 overflow-auto p-8">
            <div id="tab-clients" class="tab-content hidden space-y-6">${renderClientsTab()}</div>
            <div id="tab-licenses" class="tab-content hidden space-y-6">${renderLicensesTab()}</div>
            <div id="tab-users" class="tab-content hidden space-y-6">${renderUsersTab()}</div>
            <div id="tab-sessions" class="tab-content hidden space-y-6">${renderSessionsTab()}</div>
            <div id="tab-patients" class="tab-content hidden space-y-6">${renderPatientsTab()}</div>
            <div id="tab-files" class="tab-content hidden space-y-6">${renderFilesTab()}</div>
            <div id="tab-plugins" class="tab-content hidden space-y-6">${renderPluginsTab()}</div>
          </div>
        </main>`;
    }

    function renderNavBtn(id, label) {
      return `<button id="nav-${id}" onclick="switchTab('${id}')" class="w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium transition-all text-slate-400 hover:bg-slate-800 hover:text-slate-200">${label}</button>`;
    }

    // ==========================================================
    // --- Active Clients Tab ---
    // ==========================================================
    function renderClientsTab() {
      return `
        <div class="flex items-center gap-2 text-sm text-slate-400 mb-2">
          <span class="dot bg-emerald-400"></span> Online (heartbeat within 90s)
          <span class="dot bg-slate-500 ml-4"></span> Offline
          <span class="ml-auto text-xs text-slate-500">Auto-refreshes every 10s while this tab is open</span>
        </div>
        ${renderDataTable('clients', clientsColumns())}`;
    }

    function clientsColumns() {
      return [
        { key: 'online', label: 'Status', sortValue: r => r.online ? 1 : 0, render: r => r.online
            ? `<span class="flex items-center gap-2">${badge('Online', 'green')}</span>`
            : `<span class="flex items-center gap-2">${badge('Offline', 'slate')}</span>` },
        { key: 'machine_label', label: 'Machine', render: r => `
            <div class="font-medium text-slate-200">${escapeHtml(r.machine_label) || '<span class="text-slate-500">Unlabeled</span>'}</div>
            <div class="font-mono text-[10px] text-slate-500 mt-0.5">${escapeHtml(r.activation_id)}</div>` },
        { key: 'org_name', label: 'Org / Owner', render: r => `
            <div>${escapeHtml(r.org_name) || '<span class="text-slate-500">—</span>'}</div>
            <div class="text-xs text-slate-500">${escapeHtml(r.owner_email) || ''}</div>` },
        { key: 'license_key', label: 'License', render: r => `<span class="font-mono text-xs text-blue-300">${escapeHtml(r.license_key) || '—'}</span>` },
        { key: 'status', label: 'App State', render: r => badge(r.status || 'unknown', r.status === 'recording' ? 'amber' : (r.status === 'idle' ? 'blue' : 'slate')) },
        { key: 'pending_sync_count', label: 'Pending Sync', render: r => r.pending_sync_count > 0 ? badge(r.pending_sync_count, 'amber') : '0' },
        { key: 'os_platform', label: 'OS' },
        { key: 'app_version', label: 'Version' },
        { key: 'ip_address', label: 'IP Address' },
        { key: 'last_seen_at', label: 'Last Seen', render: r => `
            <div>${relativeTime(r.seconds_since_seen)}</div>
            <div class="text-xs text-slate-500">${fmtDate(r.last_seen_at)}</div>` },
        { key: 'is_revoked', label: 'Revoked', sortValue: r => r.is_revoked ? 1 : 0, render: r => r.is_revoked ? badge('Revoked', 'red') : '' },
      ];
    }

    async function loadClients() {
      try {
        tableState.clients.rows = await api('/admin/clients');
        rerenderTab('clients');
      } catch (e) { showToast('Failed to load active clients', 'error'); }
    }

    // ==========================================================
    // --- Licenses Tab ---
    // ==========================================================
    function renderLicensesTab() {
      return `
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6">
          <h3 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-4">Issue New License</h3>
          <div class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
            <div class="col-span-1 md:col-span-2">
              <label class="block text-xs text-slate-400 mb-1">Researcher Email</label>
              <input id="lic-email" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-blue-500 outline-none" placeholder="researcher@lab.edu" />
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Organization</label>
              <input id="lic-org" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-blue-500 outline-none" placeholder="Lab Name" />
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Seats / Days</label>
              <div class="flex gap-2">
                <input id="lic-seats" type="number" value="1" class="w-16 bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-sm focus:border-blue-500 outline-none text-center" />
                <input id="lic-days" type="number" value="365" class="w-20 bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-sm focus:border-blue-500 outline-none text-center" />
              </div>
            </div>
            <button onclick="createLicense()" class="bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 px-4 rounded-lg transition-colors h-[38px]">Issue Key</button>
          </div>
        </div>
        ${renderDataTable('licenses', licensesColumns())}`;
    }

    function licensesColumns() {
      return [
        { key: 'license_key', label: 'License Key', render: r => `<span class="font-mono text-xs text-blue-300">${escapeHtml(r.license_key)}</span>` },
        { key: 'owner_email', label: 'Owner', render: r => escapeHtml(r.owner_email) || '<span class="text-slate-500">—</span>' },
        { key: 'org_name', label: 'Org', render: r => escapeHtml(r.org_name) || '<span class="text-slate-500">—</span>' },
        { key: 'plan', label: 'Plan' },
        { key: 'active_seats', label: 'Seats', sortValue: r => r.active_seats, render: r => `${r.active_seats} / ${r.max_seats}` },
        { key: 'status', label: 'Status', render: r => badge(r.status, r.status === 'active' ? 'green' : 'red') },
        { key: 'issued_at', label: 'Issued', render: r => fmtDate(r.issued_at) },
        { key: 'expires_at', label: 'Expires', render: r => fmtDate(r.expires_at) },
        { key: 'revoked_reason', label: 'Revoked Reason', render: r => escapeHtml(r.revoked_reason) || '<span class="text-slate-500">—</span>' },
        { key: 'license_id', label: 'License ID', render: r => `<span class="font-mono text-[10px] text-slate-500">${escapeHtml(r.license_id)}</span>` },
        { key: '_actions', label: 'Actions', sortable: false, render: r => `
            <div class="text-right space-x-2 whitespace-nowrap">
              <button onclick="extendLicense('${r.license_key}')" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded transition-colors">Extend</button>
              ${r.status === 'active' ? `<button onclick="revokeLicense('${r.license_key}')" class="text-xs bg-red-900/80 hover:bg-red-800 text-red-100 px-2 py-1 rounded transition-colors">Revoke</button>` : ''}
            </div>` },
      ];
    }

    async function loadLicenses() {
      try {
        tableState.licenses.rows = await api('/admin/licenses');
        allLicenses = tableState.licenses.rows;
        rerenderTab('licenses');
        populateLicenseFilters();
      } catch (e) { showToast('Failed to load licenses', 'error'); }
    }

    async function createLicense() {
      const email = document.getElementById('lic-email').value;
      const org_name = document.getElementById('lic-org').value;
      const max_seats = document.getElementById('lic-seats').value;
      const expires_in_days = document.getElementById('lic-days').value;
      try {
        const data = await api('/admin/license/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ email, org_name, max_seats, expires_in_days }),
        });
        showToast(`License created: ${data.license_key}`);
        document.getElementById('lic-email').value = '';
        loadLicenses();
      } catch (e) { showToast(e.message, 'error'); }
    }

    async function revokeLicense(key) {
      const reason = prompt('Reason for revoking this license?');
      if (reason === null) return;
      try {
        await api('/admin/license/revoke', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ license_key: key, reason }),
        });
        showToast('License revoked');
        loadLicenses();
      } catch (e) { showToast(e.message, 'error'); }
    }

    async function extendLicense(key) {
      const days = prompt('How many days to add to this license?', '30');
      if (!days || isNaN(parseInt(days))) return;
      try {
        await api('/admin/license/extend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ license_key: key, additional_days: days }),
        });
        showToast(`License extended by ${days} days`);
        loadLicenses();
      } catch (e) { showToast(e.message, 'error'); }
    }

    function safeParseJson(s) {
      if (!s) return {};
      try { return JSON.parse(s); } catch (e) { return { raw: s }; }
    }

    function licenseBadgeFor(licenseId) {
      const lic = allLicenses.find(l => l.license_id === licenseId);
      const label = lic ? lic.license_key : (licenseId || '—');
      return `<span class="font-mono text-xs text-slate-400" title="${escapeHtml(licenseId || '')}">${escapeHtml(label)}</span>`;
    }

    function populateLicenseFilters() {
      const opts = allLicenses.map(l => `<option value="${escapeHtml(l.license_id)}">${escapeHtml(l.license_key)} (${escapeHtml(l.org_name || l.owner_email || '')})</option>`).join('');
      ['sessions-license-filter', 'patients-license-filter'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          const current = el.value;
          el.innerHTML = `<option value="">All licenses</option>${opts}`;
          el.value = current;
        }
      });
    }

    async function createPlugin() {
      const plugin_id = document.getElementById('plg-id').value;
      const name = document.getElementById('plg-name').value;
      const description = document.getElementById('plg-description').value;
      const repo_url = document.getElementById('plg-repo').value;
      const ref = document.getElementById('plg-ref').value || 'main';
      const homepage = document.getElementById('plg-homepage').value;
      const maintainer = document.getElementById('plg-maintainer').value;
      if (!plugin_id || !name || !description || !repo_url) {
        showToast('Plugin ID, Name, Description and Repo URL are required', 'error');
        return;
      }
      try {
        await api('/admin/plugins/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ plugin_id, name, description, repo_url, ref, homepage, maintainer }),
        });
        showToast(`Plugin '${plugin_id}' added as a draft — publish it to expose it to workstations`);
        ['plg-id', 'plg-name', 'plg-description', 'plg-repo', 'plg-homepage', 'plg-maintainer'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('plg-ref').value = 'main';
        loadPlugins();
      } catch (e) { showToast(e.message, 'error'); }
    }

                <div>
                  <label class="block text-xs text-slate-400 mb-1">Ref</label>
                  <input id="edit-plg-ref" value="${escapeHtml(p.ref)}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-blue-500 outline-none" />
                </div>
                <div>
                  <label class="block text-xs text-slate-400 mb-1">Maintainer</label>
                  <input id="edit-plg-maintainer" value="${escapeHtml(p.maintainer || '')}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-blue-500 outline-none" />
                </div>
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1">Homepage</label>
                <input id="edit-plg-homepage" value="${escapeHtml(p.homepage || '')}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-blue-500 outline-none" />
              </div>
            </div>
            <div class="flex justify-end gap-2 px-5 py-4 border-t border-slate-700">
              <button onclick="document.getElementById('modal-container').innerHTML=''" class="text-sm bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg transition-colors">Cancel</button>
              <button onclick="saveEditPlugin('${pluginId}')" class="text-sm bg-blue-600 hover:bg-blue-500 text-white font-medium px-3 py-1.5 rounded-lg transition-colors">Save</button>
            </div>
          </div>
        </div>`;
    }

    async function saveEditPlugin(pluginId) {
      const name = document.getElementById('edit-plg-name').value;
      const description = document.getElementById('edit-plg-description').value;
      const repo_url = document.getElementById('edit-plg-repo').value;
      const ref = document.getElementById('edit-plg-ref').value || 'main';
      const maintainer = document.getElementById('edit-plg-maintainer').value;
      const homepage = document.getElementById('edit-plg-homepage').value;
      try {
        await api('/admin/plugins/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ plugin_id: pluginId, name, description, repo_url, ref, maintainer, homepage }),
        });
        showToast('Plugin updated');
        document.getElementById('modal-container').innerHTML = '';
        loadPlugins();
      } catch (e) { showToast(e.message, 'error'); }
    }

    async function publishPlugin(pluginId) {
      try {
        await api('/admin/plugins/publish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ plugin_id: pluginId }),
        });
        showToast('Plugin published — now visible to workstations');
        loadPlugins();
      } catch (e) { showToast(e.message, 'error'); }
    }

    async function unpublishPlugin(pluginId) {
      try {
        await api('/admin/plugins/unpublish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ plugin_id: pluginId }),
        });
        showToast('Plugin unpublished — hidden from workstations, still kept as a draft');
        loadPlugins();
      } catch (e) { showToast(e.message, 'error'); }
    }

    async function deletePlugin(pluginId) {
      if (!confirm(`Permanently remove '${pluginId}' from the catalog? Workstations that already installed it keep running -- this only stops it from being offered to new ones.`)) return;
      try {
        await api(`/admin/plugins/${pluginId}`, { method: 'DELETE' });
        showToast('Plugin deleted from catalog');
        loadPlugins();
      } catch (e) { showToast(e.message, 'error'); }
    }

    // ==========================================================
    // --- Tab switching / bootstrapping ---
    // ==========================================================
    function switchTab(tabId, skipReload = false) {
      activeTab = tabId;
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`tab-${tabId}`).classList.remove('hidden');

      document.querySelectorAll('nav button').forEach(btn => {
        btn.classList.remove('bg-blue-600/10', 'text-blue-400');
        btn.classList.add('text-slate-400', 'hover:bg-slate-800');
      });
      const activeBtn = document.getElementById(`nav-${tabId}`);
      activeBtn.classList.remove('text-slate-400', 'hover:bg-slate-800');
      activeBtn.classList.add('bg-blue-600/10', 'text-blue-400');
      document.getElementById('page-title').textContent = activeBtn.textContent;

      if (clientsAutoRefresh) { clearInterval(clientsAutoRefresh); clientsAutoRefresh = null; }

      if (skipReload) { rerenderTab(tabId); return; }
      refreshTab(tabId);

      if (tabId === 'clients') {
        clientsAutoRefresh = setInterval(loadClients, 10000);
      }
    }

    function refreshTab(tabId) {
      const loaders = {
        clients: loadClients,
        licenses: loadLicenses,
        users: loadUsers,
        sessions: () => loadSessions(),
        patients: loadPatients,
        files: loadFiles,
        plugins: loadPlugins,
      };
      if (loaders[tabId]) loaders[tabId]();
      // Licenses power the filter dropdowns on Sessions/Patients — keep them warm.
      if (tabId !== 'licenses' && allLicenses.length === 0) loadLicenses();
    }

    // --- Auth ---
    async function doLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('login-error');
      try {
        const data = await api('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ email, password }),
        });
        if (data.role !== 'admin') throw new Error('This account does not have admin privileges.');
        sessionToken = data.session_token;
        currentUser = data;
        localStorage.setItem('admin_session_token', sessionToken);
        showToast('Logged in successfully');
        render();
        switchTab(activeTab);
      } catch (e) {
        errEl.textContent = e.message;
        errEl.classList.remove('hidden');
      }
    }

    function doLogout() {
      sessionToken = null;
      currentUser = null;
      localStorage.removeItem('admin_session_token');
      if (clientsAutoRefresh) { clearInterval(clientsAutoRefresh); clientsAutoRefresh = null; }
      render();
    }

    // --- Bootstrapping ---
    if (sessionToken) {
      api('/auth/session?session_token=' + sessionToken)
        .then(u => { currentUser = u; render(); switchTab(activeTab); })
        .catch(() => { sessionToken = null; render(); });
    } else {
      render();
    }
  </script>
</body>
</html>

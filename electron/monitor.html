<!DOCTYPE html>
<html>
<head>
  <title>PC Monitor</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1e1e1e;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .metric {
      background: #2d2d2d;
      padding: 15px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .label {
      font-size: 14px;
      color: #aaaaaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .value {
      font-size: 24px;
      font-weight: bold;
    }
    .bar-bg {
      height: 8px;
      background: #444;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 5px;
    }
    .bar-fill {
      height: 100%;
      background: #007acc;
      width: 0%;
      transition: width 0.3s ease;
    }
    .bar-fill.warn { background: #d7ba7d; }
    .bar-fill.danger { background: #f44747; }
  </style>
</head>
<body>

  <div class="metric">
    <div class="label">CPU Usage</div>
    <div class="value" id="cpu-val">--%</div>
    <div class="bar-bg"><div class="bar-fill" id="cpu-bar"></div></div>
  </div>

  <div class="metric">
    <div class="label">RAM Usage</div>
    <div class="value" id="ram-val">--%</div>
    <div class="bar-bg"><div class="bar-fill" id="ram-bar"></div></div>
  </div>

  <div class="metric">
    <div class="label">GPU Usage</div>
    <div class="value" id="gpu-val">--%</div>
    <div class="bar-bg"><div class="bar-fill" id="gpu-bar"></div></div>
  </div>

  <script>
    function updateBar(id, val) {
      if (val < 0) return;
      const bar = document.getElementById(id + '-bar');
      const text = document.getElementById(id + '-val');
      text.innerText = val.toFixed(1) + '%';
      bar.style.width = val + '%';

      bar.className = 'bar-fill';
      if (val > 85) bar.classList.add('danger');
      else if (val > 60) bar.classList.add('warn');
    }

    async function fetchMetrics() {
      try {
        // App runs on localhost:8000
        const res = await fetch('http://127.0.0.1:8000/api/monitor/metrics');
        if (res.ok) {
          const data = await res.json();
          if (data.cpu_load_pct !== undefined) updateBar('cpu', data.cpu_load_pct);
          if (data.ram_used_pct !== undefined) updateBar('ram', data.ram_used_pct);
          if (data.gpu_load_pct !== undefined) {
             if (data.gpu_load_pct >= 0) {
                 updateBar('gpu', data.gpu_load_pct);
             } else {
                 document.getElementById('gpu-val').innerText = 'N/A';
             }
          }
        }
      } catch (err) {
        console.error('Failed to fetch metrics:', err);
      }
    }

    setInterval(fetchMetrics, 1000);
    fetchMetrics();
  </script>
</body>
</html>

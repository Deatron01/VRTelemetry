[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

# ─────────────────────────────────────────────────────────────────────────────
# Project metadata
# ─────────────────────────────────────────────────────────────────────────────
[project]
name = "vrtelemetry"
version = "1.2.2"
description = "Biometric telemetry acquisition and analysis for VR research studies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Nagy István Bence" }]
keywords = ["vr", "telemetry", "openxr", "eye-tracking", "biometrics", "research"]
classifiers = [
    "Private :: Do Not Upload",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

# Shared by every deployable: the HTTP layer and its client.
#
# Before this file existed, requirements.txt declared pyopenxr, pyarrow, numpy,
# psutil, requests and pytest -- and omitted fastapi, uvicorn, pydantic, pandas,
# python-multipart and openvr, all of which the application imports
# unconditionally. `pip install -r requirements.txt` produced an environment
# that could not start the server or even collect the test suite. The lists
# below were derived by walking every import in src/, tests/ and tools/ with an
# AST scan, then verified by installing into a clean environment and booting.
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0",
    "pydantic>=2.6,<3.0",
    # Typed, layered configuration (VRT-6). Replaces 18 hardcoded path and URL
    # literals that were spread across seven modules as default arguments.
    "pydantic-settings>=2.2,<3.0",
    # tomllib is stdlib from 3.11; this backfills it on the 3.10 leg.
    'tomli>=2.0; python_version < "3.11"',
    # Required by FastAPI to parse Form(...) and File(...) parameters, which
    # every /data/* route on the central server uses. Never imported by name,
    # so no static scan will find it -- omitting it produces a server that
    # imports fine and then 500s on the first upload.
    "python-multipart>=0.0.9",
    "requests>=2.31,<3.0",
]

[project.optional-dependencies]
# The researcher workstation: acquisition, storage and analysis.
workstation = [
    "pyarrow>=15.0.0",
    "numpy>=1.26.4",
    "pandas>=2.2,<3.0",
    "psutil>=5.9.8",
    "pyopenxr>=1.0.31",
    # `import openvr` in backend_steamvr.py is still unguarded, but it is no
    # longer reached at import time: VRT-14 moved backend selection into
    # src/backends/registry.py, which imports the chosen backend and only that
    # one. Importing src.core.engine on a machine with no VR bindings at all now
    # works, and tests/unit/test_backend_registry.py asserts it with the imports
    # blocked at the meta path. This stays in the workstation extra because a
    # workstation that records on SteamVR needs it -- which is a different claim
    # from "nothing imports without it".
    #
    # 2.12 is a hard floor, not a rounding-up: Prop_SupportsXrEyeGazeInteraction_Bool,
    # which backend_steamvr.py's eye-tracking capability probe depends on, does
    # not exist in the property table before it. On 1.26 (this pin's old floor)
    # referencing that constant is an AttributeError, uncaught by the
    # OpenVRError/ValueError/OSError tuple the probe guards with.
    "openvr>=2.12",
]

# Oculus/LibOVR bindings. Genuinely optional: backend_ocolus.py already guards
# `import ovr` with try/except and sets OVR_AVAILABLE, which is the pattern the
# other two backends should follow. Not installable on every platform, which is
# exactly why it is not in `workstation`.
oculus = ["pyovr>=1.4"]

# A/V recording + local transcription (P-C7, addendum Section 2 "self-hosted").
# Both are genuinely optional -- everything in src/av_recording/ imports them
# lazily and turns an ImportError into AVCaptureUnavailableError /
# TranscriptionUnavailableError, never a crash at module import -- so a
# workstation that never enables `consent.enable_av_recording` has no reason to
# install a speech model. Deliberately no cloud ASR SDK here: the addendum's
# unresolved sub-processor/vendor-terms review is exactly what a self-hosted
# `faster-whisper` model avoids.
av_recording = [
    "faster-whisper>=1.0",
    # ffmpeg's own binary, not a Python binding: gdigrab/dshow capture is a
    # subprocess call (see pc_compositor_capture.py). A system ffmpeg on PATH
    # or `av_recording.ffmpeg_path` in config.toml work too; this is the
    # `pip install`-only fallback so a researcher isn't also asked to manage a
    # separate system install.
    "imageio-ffmpeg>=0.5",
]

# The central hub server needs nothing beyond the shared core: it imports only
# src.central_server, src.license_service and src.utils. Declared explicitly so
# that a server deployment is a documented install rather than an accident of
# which extras someone happened to type.
# The hub. `cryptography` is for tools/generate_hub_certificate.py, which
# creates the TLS certificate a networked hub refuses to start without (GDPR-01).
server = ["cryptography>=42"]

# tools/ documentation pipeline. Not needed to run or test the application.
docs = [
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

dev = [
    "vrtelemetry[workstation,docs]",
    # Unconditional, unlike the runtime dependency above, which is guarded by
    # `python_version < "3.11"`. mypy is configured `python_version = "3.10"`,
    # so it type-checks the 3.10 branch of settings.py's tomllib/tomli split no
    # matter which interpreter it runs on -- and the lint job runs on 3.11,
    # where the guarded dependency is skipped. The result was a CI failure that
    # named a real import the checker could not resolve:
    #     settings.py:64: error: Cannot find implementation or library stub
    #                            for module named "tomli"  [import-not-found]
    # A dev environment that checks the 3.10 branch has to have the 3.10
    # dependency installed. The alternative -- silencing the import for mypy --
    # would turn off the check the comment at that import exists to keep.
    "tomli>=2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=5.0",
    # TestClient's transport. FastAPI does not pull it in, and without it every
    # API test errors at fixture setup rather than failing informatively.
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
# Replaces the ad-hoc `python -m src.tert_runner` / `python -m uvicorn src.main:app`
# invocations scattered across package.json, backend-manager.js and the README.
vrtelemetry-server = "src.server_entrypoint:boot_server_context"
vrtelemetry-record = "src.tert_runner:boot_framework_context"
# One executable for the hub: serve (the default), gen-cert, bootstrap-admin,
# setup. The frozen hub installer has nothing else to run.
vrtelemetry-hub = "src.central_server.cli:main"
# The first admin cannot be created over HTTP by design: registration always
# makes a researcher, and promotion requires an admin session. Without this
# a fresh hub can never issue a licence, so no workstation can activate.
vrtelemetry-bootstrap-admin = "src.license_service.bootstrap_admin:main"

[tool.hatch.build.targets.wheel]
# The import root is `src` today, matching the existing `from src.core import ...`
# convention throughout the codebase. Renaming it to `vrtelemetry` is a
# repository-wide import rewrite and belongs with the layer restructure in
# VRT-15, not here -- this file's job is to make the dependency graph honest.
packages = ["src"]

# No force-include for src/central_server/admin_ui: it is tracked and lives
# inside the `src` package above, so it is already in the wheel. Force-including
# it as well put every admin-UI file into the archive twice, which current
# hatchling refuses ("A second file is being added to the wheel archive"), and
# `python -m build` -- the release workflow's wheel step -- failed outright.

# ─────────────────────────────────────────────────────────────────────────────
# pytest  (was pytest.ini)
# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --tb=short --strict-markers"
testpaths = ["tests"]

# `pythonpath = .` is deliberately gone. It was a workaround for the package
# never being installed; with `pip install -e .` the `src` package resolves
# through the editable install like any other dependency. Keeping both means
# tests can pass against a stale source tree that the installed package does
# not match.

filterwarnings = [
    "ignore::DeprecationWarning:pyarrow.*",
    "ignore::DeprecationWarning:pkg_resources.*",
]

markers = [
    "hardware: requires a VR headset connected to the host (deselect with -m 'not hardware')",
    "asyncio: exercises the asynchronous storage pipeline",
]

# ─────────────────────────────────────────────────────────────────────────────
# Coverage
# ─────────────────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/frontend/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
# No `fail_under` yet. A floor set before the API layer has any coverage at all
# would either be met trivially or block every commit. VRT-17 sets it, as a
# ratchet that only ever rises.

# ─────────────────────────────────────────────────────────────────────────────
# tox  (was tox.ini)
# ─────────────────────────────────────────────────────────────────────────────
[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py310, py311, py312
isolated_build = True

[testenv]
extras = dev
commands =
    pytest tests/unit tests/integration -m "not hardware" {posargs}
"""

# ─────────────────────────────────────────────────────────────────────────────
# Ruff — linter and formatter
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/frontend", "doc", "node_modules"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "T20",       # no print()
    "SIM",       # simplify
    "PTH",       # use pathlib
    "RUF",       # ruff-specific
    "BLE",       # blind except
    "ARG",       # unused arguments
    "DTZ",       # naive datetimes
    "S",         # bandit security rules
]
ignore = [
    "E501",    # line length is the formatter's job, not the linter's
    "S101",    # assert: correct in tests, and used as an invariant check elsewhere
    "B008",    # FastAPI's Depends()/Form()/File() are call-in-default by design
]

[tool.ruff.lint.per-file-ignores]
# Tools are operator scripts run by hand; printing is their interface.
"tools/*" = ["T20", "S603", "S607"]
# bootstrap_admin.py is an interactive CLI for creating the first admin account.
"src/license_service/bootstrap_admin.py" = ["T20"]
# The hub's command line and the certificate tool it runs; printing is their
# interface, as for bootstrap_admin.py above.
"src/central_server/cli.py" = ["T20"]
"src/central_server/certificates.py" = ["T20"]
# Tests assert on private state and use hardcoded fixtures by design.
# S607: a couple of tests shell out to `git` to build a fixture repository;
# a full path would be less portable than the partial one, not safer.
"tests/*" = ["S105", "S106", "S104", "S108", "ARG001", "SLF001", "S607"]
# The openvr fakes mirror IVRSystem's own camelCase surface (getPlayAreaSize,
# bPoseIsValid, ...). Renaming them to snake_case would stop them standing in
# for the thing they replace, so the vendor's spelling wins over the naming
# rule here -- for these doubles only, not for the tests around them.
"tests/unit/test_backend_steamvr.py" = ["N802", "N815"]

# VRT-10 moved these handlers out of src/main.py unchanged, so the exemptions
# followed the code rather than being new debt. VRT-12 then deleted src/main.py's
# own entry entirely, and VRT-13 has now cleared the error-handling debt from
# all nine router/CLI entries that stood here. What is left is one file with
# SQL built by interpolation, which belongs to VRT-11.
"src/interfaces/api/routers/sessions.py" = ["S608", "W291"]

# ── Inherited debt, scoped per file ──────────────────────────────────────────
# These rules stay SELECTED globally, so any new or newly-touched file is held
# to the full standard. The exemptions below record exactly which existing files
# violate which rule today. This is a ratchet: entries are deleted as the owning
# ticket lands, and nothing is ever added without one.
#
#   BLE001, B904, S110, SIM105 ..................... VRT-13, DONE
#           69 sites across 30 files. Every one was decided
#           individually: narrowed to what the call can actually
#           raise, suppressed with a written reason, or kept broad
#           with a `# noqa: BLE001` naming why. The rules are now
#           enforced everywhere with no exemptions, which means a
#           new blind `except Exception` fails CI rather than
#           joining a list. Do not re-add an entry for these four.
#   DTZ003, DTZ007 ................................. VRT-21, DONE
#           All 17 sites go through src/utils/clock.py now. The
#           backlog's description of this one was wrong and the
#           correction is in that module's docstring: naive-UTC
#           compared against naive-UTC is timezone-independent
#           and those comparisons were correct. What was wrong
#           is that the convention was never stated -- so aware
#           and naive values coexist one TypeError apart, a NULL
#           expiry raised instead of meaning "no expiry", and
#           the zone-less wire format was read as local time by
#           the hub's dashboard. Do not re-add these two.
#   S608    SQL built by string interpolation (column names
#           only; values are parameterised) ................... VRT-11
#   E402    imports below module-level code; src/main.py's four
#           are gone, the hub's remain ........................ VRT-15
#   ARG001  unused function arguments -- the hub's admin routes
#           take `admin=Depends(require_admin)` purely for the
#           guard's side effect. The fix is to move it to the
#           decorator's `dependencies=[...]` ................. VRT-15
#   PTH*    os.path/open instead of pathlib ................... VRT-20
#   S104 ............................................ VRT-16, DONE
#           The two per-file entries were stale: VRT-6 moved
#           every bind address into settings.py, which carries
#           its own `# noqa: S104 - LAN service by design` at
#           the two literals that remain. Nothing under src/
#           hardcodes an address any more.
#   S602/S607  subprocess without a full path ................. VRT-20
#   others  naming, comprehension and mutable-default nits .... VRT-20
"src/backends/openxr_headless.py" = ["N806"]
"src/central_server/data_manager.py" = ["S608"]
"src/central_server/data_schema.py" = ["N806", "W293"]
"src/central_server/server.py" = ["ARG001", "E402", "RUF034"]
"src/core/derived_metrics.py" = ["B905"]
"src/eye_tracking/factory.py" = ["RUF012"]
"src/license_service/local_cache.py" = ["RUF013"]
"src/patients/patient_manager.py" = ["RUF005", "S608"]
"src/storage/ai_preprocessor.py" = ["RUF012"]
"src/storage/database_manager.py" = ["RUF005", "S608", "W293"]
"src/storage/parquet_writer.py" = ["B905", "PTH123", "SIM115"]
# Same reason as parquet_writer.py above: pyarrow.parquet.ParquetWriter needs
# a raw file object it can hold open across many push()/flush() calls and
# fsync() directly -- not a Path.open() context manager scoped to one call.
"src/storage/biosensor_sidecar.py" = ["PTH123", "SIM115"]
"src/storage/session_uploader.py" = ["PTH123"]
"src/utils/hardware_monitor.py" = ["S607"]
# Same nvidia-smi probe as hardware_monitor.py, resolved from PATH.
"src/interfaces/api/routers/monitor.py" = ["S607"]
# The Win32 structures keep the SDK's own names (DXGI_OUTDUPL_DESC, ...) and
# ctypes reads `_fields_` as a class attribute by protocol -- the same
# vendor-spelling-wins reasoning as the openvr fakes and openxr_headless.py.
"src/backends/desktop_mirror.py" = ["N801", "N806", "RUF012"]
"src/utils/system_profiler.py" = ["E741", "S607"]
"tools/append_structure.py" = ["B007", "B905", "C414"]
"tools/generate_docs.py" = ["PTH123", "RUF005", "S608"]
"tools/generate_graphs.py" = ["PTH107", "PTH123", "S602"]
"tools/merge_and_clean_docs.py" = ["B905", "C414"]
"tools/run_documentation_pipeline.py" = ["F841"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ─────────────────────────────────────────────────────────────────────────────
# mypy
# ─────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
files = ["src", "tools"]
exclude = ["src/frontend/", "build/"]

# `src` is a namespace package (no __init__.py at its root), so without these
# mypy resolves the same file under two module names -- "core.datatypes" and
# "src.core.datatypes" -- and refuses to check anything. Both settings go away
# when the package becomes src/vrtelemetry/ in VRT-15.
mypy_path = "."
explicit_package_bases = true
namespace_packages = true

# Baseline for the whole tree. Deliberately not --strict: switching it on
# repository-wide today produces hundreds of errors, which means it gets
# disabled again within a week. The strict set below is a ratchet -- modules
# join it as their ticket lands, and the list only ever grows.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Third-party packages without type information. Listed individually rather
# than with a blanket ignore_missing_imports so that a genuinely mistyped
# import name still fails.
module = [
    "xr.*", "openvr.*", "ovr.*", "pyarrow.*", "google.*", "dotenv.*",
    # Ship no stubs and have none on typeshed for the versions pinned here.
    "psutil.*", "pandas.*",
    # av_recording extra: genuinely not installed by `pip install -e ".[dev]"`
    # (see pyproject's av_recording extra docstring) -- mypy can't find any
    # stub or source at all for these, so it raises import-not-found rather
    # than import-untyped, which the inline `# type: ignore[import-untyped]`
    # at each lazy `import` site does not cover. Listed here instead so both
    # error codes are silenced without a blanket ignore.
    "faster_whisper.*", "imageio_ffmpeg.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Strict set. Add modules here as they are cleaned up; never remove one.
module = [
    "src.core.datatypes",
    "src.core.exceptions",
    "src.core.interfaces",
    "src.utils.log_redaction",
    "src.analytics.questionnaires",
    # Joined in VRT-14. New modules go in here on the day they are written --
    # a module is never easier to make strict than before anything imports it.
    "src.application.ports",
    "src.application.recording_context",
    "src.infrastructure.transport",
    "src.backends.registry",
    "src.backends.tracking_faults",
    "src.eye_tracking.base_driver",
    "src.utils.clock",
    "src.version",
    # Biosensor plugin support (VRT-32..36) -- new modules, held to the
    # strict set from the day they were written, per this list's own rule.
    "src.core.live_biometrics",
    "src.core.biosensor_status",
    "src.storage.biosensor_sidecar",
    "src.infrastructure.persistence.biosensor_repository",
    "src.interfaces.api.schemas.biosensors",
    "src.interfaces.api.routers.biosensors",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
# ── Type-checking debt, scoped per module ───────────────────────────────────
# Baseline at the time this gate was introduced: 60 errors in 14 modules.
# The checker runs over the whole tree; these modules are exempted individually
# so that every other file -- and every new file -- is checked for real. Same
# ratchet rule as the ruff block: entries are deleted as the owning ticket
# lands, the count only ever falls, and nothing joins this list without a
# ticket beside it.
#
# VRT-14 cleared six of these modules by fixing the code rather than the list:
# the engine's eleven were `union-attr` on `self.backend` and `self._async_loop`,
# both legitimately Optional between construction and start(), and both fixed by
# passing the value into the method that uses it instead of reading it back off
# `self`. The two `configured_backend` / `network_port` errors were the API route
# and the CLI assigning attributes the class never declared; they are constructor
# arguments now.
#
# VRT-17 then cleared the two OpenXR modules as well. Their errors were ctypes
# handles annotated `None` in __init__ and assigned real handles later,
# `ctypes.windll` on a non-Windows checker, and two reads of
# `eye_driver.gaze_action_set` -- an attribute `IEyeTrackingDriver` did not
# declare. Declaring it is what led to the bug in that note: the EXT driver
# attached its own session action sets, which made the OpenXR backend fail to
# bind on every headset that selected it. See tests/unit/test_eye_tracking_contract.py.
#
# Every module under src/backends is now type-checked.
module = [
    "src.central_server.server",                   #  1 error(s) - VRT-15
    "src.license_service.local_cache",             #  4 error(s) - VRT-11
    "src.interfaces.api.routers.licence",    #  8 error(s) - VRT-11 (LocalLicenseCache signatures)
    "src.interfaces.api.routers.questionnaires", #  2 error(s) - VRT-20
    "src.patients.patient_manager",                #  1 error(s) - VRT-11
    "src.storage.database_manager",                #  3 error(s) - VRT-11
    "src.storage.parquet_writer",                  #  3 error(s) - VRT-11
    "src.storage.sync_scheduler",                  #  2 error(s) - VRT-11
    "src.utils.logger",                            #  1 error(s) - VRT-19 (structured logging)
    "tools.generate_docs",                         #  1 error(s) - VRT-20
]
ignore_errors = true

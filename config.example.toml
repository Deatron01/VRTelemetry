# config.example.toml — copy to config.toml in your data root to use it.
#
# Every value here is optional; the defaults are in src/config/settings.py.
# Precedence, lowest to highest:
#
#   1. the defaults in settings.py
#   2. this file (config.toml in the data root)
#   3. environment variables:  VRT_CENTRAL__URL, VRT_PATHS__DATA_ROOT, ...
#      (prefix VRT_, double underscore between levels)
#   4. explicit arguments at the call site
#
# Anything invalid fails at startup naming the field, rather than at first use.

[paths]
# Root for all runtime data. Defaults to the process working directory, which
# is what the old relative paths effectively meant — so leaving this unset
# keeps an existing install pointed at its existing databases.
#
# Set it to stop behaviour depending on where you launched from:
# data_root = "C:/Users/nipit/Desktop/VRTelemetry"

[central]
# The hub this workstation uploads to. There is deliberately NO default: unset
# means unset, and the app reports it as such. The old code defaulted to
# "http://192.168.1.X:9000" — a placeholder with a letter where an octet
# belongs — so an unconfigured install failed with a DNS error instead of
# telling you to configure it. That exact string is now rejected.
# url = "https://192.168.1.50:9000"
# timeout_sec = 10.0
#
# TLS (GDPR-01). Participant data is never sent over plain http:// except to
# this machine's own loopback. A LAN hub with a certificate from
# tools/generate_hub_certificate.py needs its CA here:
# ca_bundle = "C:/VRTelemetry/hub-ca.pem"
# Disposable test setups only -- logs a warning for every request:
# allow_insecure_http = false

[api]
# The workstation's own API, spawned by the Electron shell. Loopback on
# purpose: only the local app calls it, and it serves patient records.
# host = "127.0.0.1"
# port = 8000

[hub]
# The central hub, when this process IS the hub. Binds all interfaces because
# other machines must reach it — narrow this in deployment if you can.
# host = "0.0.0.0"
# port = 9000
# client_online_threshold_sec = 90
#
# TLS (GDPR-01). Required on any non-loopback interface; the hub refuses to
# start without it. Create both with tools/generate_hub_certificate.py.
# tls_certfile = "C:/VRTelemetry/CentralServer/tls/hub-cert.pem"   # absolute paths
# tls_keyfile = "C:/VRTelemetry/CentralServer/tls/hub-key.pem"
# allow_insecure_http = false     # disposable test setups only

[acquisition]
# default_max_sampling_hz = 120.0
# sampling_headroom = 1.2          # applied to the HMD's reported refresh rate
# udp_host = "0.0.0.0"             # Quest standalone stream; the headset is remote
# udp_port = 5005
# enable_quest_udp = false         # GDPR-12: unencrypted, unauthenticated; off unless secured
# enable_desktop_mirror = true     # feed the desktop into the VR compositor mirror window
                                   # (openxr_headless only — keeps the SteamVR window non-black)

[sync]
# interval_sec = 20.0
# heartbeat_interval_sec = 30.0
# max_frames_to_client = 60000     # downsample cap for the browser

[consent]
# What the participant consent screen says about THIS study (GDPR-09). The
# wording itself is fixed in src/patients/consent_texts.py; these values are
# filled into it. Until the bracketed placeholders are replaced, the app warns
# that the consent screen is not configured -- consent to "[Laboratory Name]"
# informs nobody of anything.
# laboratory_name = "Example University VR Lab"
# laboratory_contact = "vrlab-privacy@example.edu"
# provider_name = "Example Company Kft."
# provider_contact = "privacy@example.com"
# study_id = "vr-balance-2026"          # consent never carries over to another study
# study_title = "Balance and gaze in virtual reality"
# study_purpose = "to measure how people keep their balance while looking at moving targets"
# retention = "5 years after the end of the study"
# notice_version = "1.0"                # version of the participant privacy notice
# notice_url = ""                       # where the full notice can be read
# offer_provider_research = true        # the optional P-C5 box (Terms of Service 6.4)
# records_heart_rate = true             # name only the sensors actually recorded
# records_voice_level = true
# wording_language = "en"

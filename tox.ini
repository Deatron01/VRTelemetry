# tox.ini — TOMBSTONE, safe to delete
#
# Superseded by [tool.tox] in pyproject.toml. Kept only because this session
# cannot delete files on your machine (the local shell is unavailable), and an
# unexplained leftover is worse than an explained one.
#
#     git rm pytest.ini tox.ini config.json src/utils/auto_installer.py

[tox]
envlist = py310, py311, py312
isolated_build = True

[testenv]
extras = dev
commands =
    pytest tests/unit tests/integration -m "not hardware" {posargs}

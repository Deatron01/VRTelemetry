# pytest.ini — TOMBSTONE, safe to delete
#
# This file is superseded by [tool.pytest.ini_options] in pyproject.toml, which
# is now the single place test configuration lives.
#
# It cannot simply be emptied: pytest treats a pytest.ini as authoritative even
# when it is empty, and would then ignore the pyproject settings entirely. So
# the settings below mirror pyproject.toml exactly, and behaviour is identical
# whether this file is present or not.
#
# Delete it when you commit:
#     git rm pytest.ini tox.ini config.json src/utils/auto_installer.py

[pytest]
minversion = 8.0
addopts = -ra -q --tb=short --strict-markers
testpaths = tests

filterwarnings =
    ignore::DeprecationWarning:pyarrow.*
    ignore::DeprecationWarning:pkg_resources.*
    ignore:.*on_event is deprecated.*:DeprecationWarning

markers =
    hardware: requires a VR headset connected to the host (deselect with -m "not hardware")
    asyncio: exercises the asynchronous storage pipeline

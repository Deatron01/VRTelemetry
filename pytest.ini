# pytest.ini

[pytest]
minversion = 8.0
addopts = -ra -q --tb=short
testpaths =
    tests

# Explicitly add the root folder to the Python path to resolve ModuleNotFoundError
pythonpath = .

# Suppress PyArrow and Asyncio internal warnings during test execution
filterwarnings =
    ignore::DeprecationWarning:pyarrow.*
    ignore::DeprecationWarning:pkg_resources.*

# Custom markers
markers =
    hardware: marks tests that require an active VR headset connected to the host (deselect with '-m "not hardware"')
    asyncio: marks tests that utilize the asynchronous storage pipeline
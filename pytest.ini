[pytest]
minversion = 7.0
addopts = -v --strict-markers --cov=src --cov-report=html:reports/htmlcov --cov-report=term-missing
testpaths = tests
markers =
    unit: Fast, isolated unit tests focusing on data structures and math.
    integration: Tests validating module-to-module communication.
    stress: Long-duration, high-frequency execution tests.
    io: Tests involving disk writing (Parquet/SQLite).